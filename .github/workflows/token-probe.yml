name: Token Probe (temporary)

# 临时探针 第二轮：验证「把 stargazers{totalCount} 换成 stargazerCount」后，
# stats-readme 的两个完整查询能否在默认 GITHUB_TOKEN 下跑通。
# 纯只读。验证完即删。

on:
  workflow_dispatch:

jobs:
  probe:
    name: Verify fixed queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const login = 'yunsii'

            // ---- 修复版 user-stats 查询：stargazers{totalCount} -> stargazerCount ----
            const userStatsQuery = `
              query userInfo($login: String!) {
                user(login: $login) {
                  name
                  login
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestReviewContributions
                  }
                  repositoriesContributedTo(first: 1, contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]) {
                    totalCount
                  }
                  pullRequests(first: 1) { totalCount }
                  openIssues: issues(states: OPEN) { totalCount }
                  closedIssues: issues(states: CLOSED) { totalCount }
                  followers { totalCount }
                  repositories(first: 100, ownerAffiliations: OWNER, orderBy: {direction: DESC, field: STARGAZERS}) {
                    totalCount
                    nodes { stargazerCount }
                  }
                }
              }`

            // ---- top-languages 查询：原样，未改 ----
            const topLangsQuery = `
              query userInfo($login: String!) {
                user(login: $login) {
                  repositories(ownerAffiliations: OWNER, isFork: false, first: 100) {
                    nodes {
                      name
                      languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                        edges { size node { color name } }
                      }
                    }
                  }
                }
              }`

            let ok = true

            try {
              const d = await github.graphql(userStatsQuery, { login })
              const u = d.user
              const totalStars = u.repositories.nodes.reduce((p, c) => p + c.stargazerCount, 0)
              core.info('✅ 修复版 user-stats 查询通过')
              core.info(`   name=${u.name} repos=${u.repositories.totalCount} followers=${u.followers.totalCount}`)
              core.info(`   commits(1y)=${u.contributionsCollection.totalCommitContributions} PRs=${u.pullRequests.totalCount}`)
              core.info(`   issues=${u.openIssues.totalCount + u.closedIssues.totalCount} contributedTo=${u.repositoriesContributedTo.totalCount}`)
              core.info(`   >>> Total Stars Earned = ${totalStars}   (README 里应显示这个数)`)
              core.info(`   返回节点数=${u.repositories.nodes.length}`)
            } catch (e) {
              ok = false
              core.info(`❌ 修复版 user-stats 失败: 错误数=${(e.errors||[]).length}`)
              for (const err of (e.errors||[]).slice(0,3)) {
                core.info(`   ${JSON.stringify({type: err.type, path: err.path, message: err.message})}`)
              }
            }

            try {
              const d = await github.graphql(topLangsQuery, { login })
              const nodes = d.user.repositories.nodes
              const withLang = nodes.filter(n => n.languages.edges.length > 0)
              const agg = {}
              for (const n of withLang) for (const e of n.languages.edges) {
                agg[e.node.name] = (agg[e.node.name] || 0) + e.size
              }
              const top = Object.entries(agg).sort((a,b) => b[1]-a[1]).slice(0,5)
              core.info('✅ top-languages 查询通过（未改动）')
              core.info(`   仓库数=${nodes.length} 含语言的=${withLang.length}`)
              core.info(`   >>> Top 5: ${top.map(([k,v]) => `${k}(${v})`).join(', ')}`)
            } catch (e) {
              ok = false
              core.info(`❌ top-languages 失败: 错误数=${(e.errors||[]).length}`)
              for (const err of (e.errors||[]).slice(0,3)) {
                core.info(`   ${JSON.stringify({type: err.type, path: err.path, message: err.message})}`)
              }
            }

            try {
              const r = await github.rest.search.commits({ q: `author:${login}`, per_page: 1 })
              core.info(`✅ REST search/commits  >>> Total Commits = ${r.data.total_count}`)
            } catch (e) {
              ok = false
              core.info(`❌ REST search/commits  ${e.status} ${e.message}`)
            }

            core.info(`\n===== 修复方案${ok ? '完全可行：无需任何 PAT' : '仍有问题'} =====`)
